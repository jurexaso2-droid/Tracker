<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trace - GPS Tracker</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            background: #111;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
            z-index: 2000;
        }
        
        h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; font-weight: 600; }

        /* Main Container */
        #app-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* Views */
        .view {
            display: none; /* Hidden by default */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            padding: 20px;
            box-sizing: border-box;
            background: var(--bg-color);
            z-index: 10;
        }

        /* Show active view */
        .view.active { display: flex; }

        /* The Map needs to fill the tracker view */
        #view-tracker { padding: 0; }
        #map { width: 100%; height: 100%; }

        /* Cards */
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        h2 { margin-top: 0; color: var(--accent); }
        p { color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }

        /* Buttons */
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        .btn-primary { background: var(--accent); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }

        /* Status Bar */
        #status-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            color: #fff;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            border: 1px solid #334155;
            white-space: nowrap;
            display: none;
            z-index: 3000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* Link Box */
        .link-box {
            background: #020617;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            word-break: break-all;
            margin: 10px 0 20px 0;
            font-size: 0.85rem;
            user-select: all;
        }

        /* Loader */
        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Target Mode Specifics */
        .pulse-ring {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--success);
            margin: 0 auto 20px auto;
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse-green 2s infinite;
        }
        
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body>

<header>
    <h1>Trace Location</h1>
</header>

<div id="app-container">
    
    <!-- VIEW 1: SETUP (First screen you see) -->
    <div id="view-setup" class="view active">
        <div class="card">
            <h2>Tracker Setup</h2>
            <p>I want to use <b>this phone</b> to:</p>
            <button class="btn-primary" onclick="app.createSession()">📍 Track Another Phone</button>
            <p style="font-size:0.8rem; margin-top:15px; opacity:0.6">
                (Click this to generate a link for your brother's phone)
            </p>
        </div>
    </div>

    <!-- VIEW 2: TRACKER MAP (You watching) -->
    <div id="view-tracker" class="view">
        <div id="map"></div>
        
        <!-- Controls overlay -->
        <div id="tracker-controls" class="card" style="position:absolute; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000; width:90%; padding:15px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3 style="margin:0; font-size:1rem; color:white;">Monitoring...</h3>
                <span onclick="document.getElementById('share-modal').style.display='flex'" style="cursor:pointer; background:#334155; padding:5px 10px; border-radius:5px; font-size:0.8rem;">🔗 Link</span>
            </div>
            <div id="last-update" style="font-size:0.8rem; color:#94a3b8;">Waiting for signal...</div>
        </div>

        <!-- Share Modal -->
        <div id="share-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:5000; align-items:center; justify-content:center;">
            <div class="card">
                <h3>Connection Link</h3>
                <p>Send this to the old phone:</p>
                <div class="link-box" id="share-link">...</div>
                <button class="btn-primary" onclick="app.copyLink()">Copy Link</button>
                <button class="btn-danger" onclick="document.getElementById('share-modal').style.display='none'" style="margin-top:10px; background:transparent; border:1px solid #ef4444; color:#ef4444;">Close</button>
            </div>
        </div>
    </div>

    <!-- VIEW 3: TARGET (Brother's Phone) -->
    <div id="view-target" class="view">
        <div class="card">
            <div id="signal-icon" style="width:60px; height:60px; background:#334155; border-radius:50%; margin:0 auto 20px auto; display:flex; align-items:center; justify-content:center; font-size:24px;">📡</div>
            
            <h2>Device Linked</h2>
            <p id="target-msg">Ready to start tracking.</p>
            
            <button id="btn-start" class="btn-success" onclick="app.startSharing()">Start GPS</button>
            <button id="btn-stop" class="btn-danger" onclick="app.stopSharing()" style="display:none;">Stop GPS</button>
            
            <div id="debug-log" style="margin-top:15px; font-size:0.75rem; color:#64748b; font-family:monospace; text-align:left; background:#111; padding:10px; border-radius:5px; display:none;"></div>
        </div>
    </div>

    <div id="status-bar"><span class="spinner"></span> Connecting...</div>

</div>

<!-- Libraries -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

<script>
/* 
 * TRACE SYSTEM v2 (Secure WebSocket Fix)
 */

const App = {
    // UPDATED CONFIG: Using Secure WebSocket (wss) on Port 8084 (Standard for SSL MQTT)
    mqttConfig: {
        host: "broker.emqx.io",
        port: 8084, 
        path: "/mqtt",
        useSSL: true,
        clientId: "trace_" + Math.random().toString(16).substr(2, 8)
    },
    
    client: null,
    sessionId: null,
    role: null, 
    map: null,
    marker: null,
    watchId: null,

    init: function() {
        const urlParams = new URLSearchParams(window.location.search);
        this.sessionId = urlParams.get('id');

        if (this.sessionId) {
            // TARGET MODE (Old Phone)
            this.role = 'target';
            this.showView('view-target');
            this.connectMqtt();
        } else {
            // SETUP MODE (Your Phone)
            this.role = 'setup';
            this.showView('view-setup');
        }
    },

    createSession: function() {
        this.sessionId = Math.random().toString(36).substr(2, 9);
        this.role = 'tracker';
        
        // Build Link
        const link = `${window.location.protocol}//${window.location.host}${window.location.pathname}?id=${this.sessionId}`;
        document.getElementById('share-link').innerText = link;
        
        // Switch View
        this.showView('view-tracker');
        document.getElementById('share-modal').style.display = 'flex'; // Show link immediately
        
        // Start System
        this.initMap();
        this.connectMqtt();
    },

    // --- MQTT (NETWORKING) ---
    connectMqtt: function() {
        this.showStatus("Connecting to secure network...", true);
        
        try {
            this.client = new Paho.MQTT.Client(
                this.mqttConfig.host, 
                this.mqttConfig.port, 
                this.mqttConfig.path,
                this.mqttConfig.clientId
            );
        } catch(e) {
            alert("Error initializing network: " + e.message);
            return;
        }

        this.client.onConnectionLost = (res) => {
            console.warn("Lost connection:", res.errorMessage);
            this.showStatus("Connection lost. Reconnecting...", true);
            setTimeout(() => this.connectMqtt(), 3000); // Auto retry
        };

        this.client.onMessageArrived = (msg) => {
            if (this.role === 'tracker') this.handleMessage(msg);
        };

        const options = {
            useSSL: this.mqttConfig.useSSL,
            timeout: 10,
            onSuccess: () => {
                this.showStatus("Online", false);
                this.onConnect();
            },
            onFailure: (ctx) => {
                console.error("Connection Failed", ctx);
                this.showStatus("Network blocked. Retrying...", true);
                setTimeout(() => this.connectMqtt(), 5000);
            }
        };

        try {
            this.client.connect(options);
        } catch(e) {
            console.error(e);
            this.showStatus("Connection Error. Check Internet.");
        }
    },

    onConnect: function() {
        const topic = `trace_gps/${this.sessionId}`;
        
        if (this.role === 'tracker') {
            this.client.subscribe(topic);
            this.showStatus("Waiting for signal...");
        } else if (this.role === 'target') {
            document.getElementById('target-msg').innerHTML = "Connected to server.<br>Press Start to share location.";
            document.getElementById('target-msg').style.color = "#4ade80";
        }
    },

    // --- TRACKER LOGIC ---
    handleMessage: function(message) {
        try {
            const data = JSON.parse(message.payloadString);
            const lat = parseFloat(data.lat);
            const lng = parseFloat(data.lng);
            
            if (!this.map) return;

            const latLng = [lat, lng];
            
            // Update Marker
            if (!this.marker) {
                this.marker = L.marker(latLng).addTo(this.map);
                this.map.setView(latLng, 17);
            } else {
                this.marker.setLatLng(latLng);
                this.map.panTo(latLng);
            }

            // Google Maps Link
            const googleLink = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
            
            this.marker.bindPopup(`
                <div style="text-align:center">
                    <b>Brother's Location</b><br>
                    <a href="${googleLink}" target="_blank" 
                       style="display:inline-block; margin-top:8px; padding:6px 12px; background:#3b82f6; color:white; text-decoration:none; border-radius:4px; font-weight:bold;">
                       Navigate Here
                    </a>
                </div>
            `).openPopup();

            document.getElementById('last-update').innerText = "Updated: " + new Date().toLocaleTimeString();
            document.getElementById('share-modal').style.display = 'none'; // Auto hide link on first signal

        } catch (e) {
            console.error("Data error", e);
        }
    },

    initMap: function() {
        // Initialize map immediately (even without signal)
        this.map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(this.map);
    },

    // --- TARGET LOGIC ---
    startSharing: function() {
        if (!navigator.geolocation) return alert("GPS not supported");

        document.getElementById('btn-start').style.display = 'none';
        document.getElementById('btn-stop').style.display = 'block';
        document.getElementById('signal-icon').innerHTML = ""; 
        document.getElementById('signal-icon').className = "pulse-ring"; // Start animation

        this.showStatus("Acquiring GPS...", true);

        this.watchId = navigator.geolocation.watchPosition(
            (pos) => {
                this.sendLocation(pos.coords.latitude, pos.coords.longitude);
            }, 
            (err) => {
                alert("GPS Error: " + err.message + ". Check Permissions.");
                this.stopSharing();
            }, 
            { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
        );
    },

    sendLocation: function(lat, lng) {
        if (!this.client || !this.client.isConnected()) return;

        const payload = JSON.stringify({ lat: lat, lng: lng, t: Date.now() });
        const message = new Paho.MQTT.Message(payload);
        message.destinationName = `trace_gps/${this.sessionId}`;
        this.client.send(message);

        this.showStatus(`Sending: ${lat.toFixed(5)}, ${lng.toFixed(5)}`);
        
        // Debug Log
        const log = document.getElementById('debug-log');
        log.style.display = 'block';
        log.innerHTML = `Last sent: ${new Date().toLocaleTimeString()}<br>Lat: ${lat}<br>Lng: ${lng}`;
    },

    stopSharing: function() {
        if (this.watchId) navigator.geolocation.clearWatch(this.watchId);
        document.getElementById('btn-start').style.display = 'block';
        document.getElementById('btn-stop').style.display = 'none';
        document.getElementById('signal-icon').className = "";
        document.getElementById('signal-icon').innerHTML = "📡";
        document.getElementById('target-msg').innerText = "Tracking Stopped";
        this.showStatus("Stopped");
    },

    // --- UTILS ---
    showView: function(id) {
        document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    },

    copyLink: function() {
        const text = document.getElementById('share-link').innerText;
        navigator.clipboard.writeText(text).then(() => alert("Link Copied!"));
    },

    showStatus: function(msg, loading=false) {
        const bar = document.getElementById('status-bar');
        const spinner = bar.querySelector('.spinner');
        bar.style.display = 'block';
        
        // Update text node only
        bar.childNodes[1].textContent = " " + msg;
        spinner.style.display = loading ? 'inline-block' : 'none';

        if (!loading) setTimeout(() => { bar.style.display = 'none'; }, 3000);
    }
};

// Start
document.addEventListener('DOMContentLoaded', () => { app = App; app.init(); });

// Global Error Handler
window.onerror = function(msg, source, lineno) {
    alert("Script Error: " + msg);
};
</script>
</body>
</html>
